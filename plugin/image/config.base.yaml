# Config base do perfil DEFAULT do rt-hermes (plano de controle: health/capabilities).
# Os perfis de trabalho (empresa__template__usuario) recebem config.yaml proprio gerado por
# profiles/profile_config.py. O default nao atende runs de usuario.
model:
  default: agente-padrao
  provider: custom
  base_url: http://llm-gw:4000/v1
  context_length: 128000
platform_toolsets:
  api_server: [skills]
agent:
  max_turns: 10
skills:
  project_discovery: false
  write_approval: true
  inline_shell: false
memory:
  write_approval: true
  nudge_interval: 0
curator:
  enabled: false
sessions:
  auto_prune: false
security:
  allow_lazy_installs: false
  redact_secrets: true
gateway:
  strict: true
  multiplex_profiles: true
  api_server:
    max_concurrent_runs: 4
