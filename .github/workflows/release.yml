name: Release
# Publica a imagem por digest + release-manifest.json. NAO faz deploy (so o vps_rt_infra implanta).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: v0.1.1); cria a tag no commit atual"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Gate (mesma imagem)
        run: bash scripts/verify.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/harness.Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/rangeltech/kernel-harness/harness:${{ steps.v.outputs.version }}
      - name: Manifesto
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          cat > release-manifest.json <<EOF
          {
            "schema": 1,
            "service": "kernel-harness",
            "repo": "RangelTech/kernel-harness",
            "commit": "${GITHUB_SHA::7}",
            "version": "${{ steps.v.outputs.version }}",
            "image": "ghcr.io/rangeltech/kernel-harness/harness@${DIGEST}",
            "built_at": "$(date -u +%FT%TZ)",
            "contracts": {"api": "0.1.0"},
            "healthcheck": {"path": "/health", "expect": 200, "timeout_s": 60, "port": 8080},
            "env": {"required": []},
            "resources": {"memory": "512m", "cpus": "0.5"}
          }
          EOF
          python3 -c "import json;json.load(open('release-manifest.json'))"
      - name: GitHub Release com o manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" release-manifest.json --title "${{ steps.v.outputs.version }}" --notes "Imagem: $(python3 -c "import json;print(json.load(open('release-manifest.json'))['image'])")" --target "${GITHUB_SHA}" || gh release upload "${{ steps.v.outputs.version }}" release-manifest.json --clobber
