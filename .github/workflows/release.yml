name: Release
# Publica a imagem por digest + release-manifest.json. NAO faz deploy (so o vps_rt_infra implanta).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: v0.1.1); cria a tag no commit atual"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Gate (mesma imagem)
        run: bash scripts/verify.sh
      - name: Build das imagens (mesmos Dockerfiles do gate)
        run: |
          V="${{ steps.v.outputs.version }}"
          docker build -f docker/harness.Dockerfile --build-arg GIT_COMMIT="${GITHUB_SHA}" -t "kernel-harness/harness:${V}" .
          docker build -f docker/hermes.Dockerfile -t "kernel-harness/rt-hermes:${V}" .
          docker save "kernel-harness/harness:${V}" | gzip -9 > kernel-harness.image.tar.gz
          docker save "kernel-harness/rt-hermes:${V}" | gzip -9 > rt-hermes.image.tar.gz
          ls -l *.image.tar.gz
      - name: Manifestos (um por servico)
        run: |
          python3 - <<'PY'
          import json, os, hashlib, subprocess, datetime, re, tarfile
          v = "${{ steps.v.outputs.version }}"
          def image_id(path):
              with tarfile.open(path, "r:gz") as t:
                  m = json.load(t.extractfile("manifest.json"))
              return "sha256:" + re.sub(r"^.*/", "", m[0]["Config"]).replace(".json", "")
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for c in iter(lambda: f.read(1 << 20), b""):
                      h.update(c)
              return h.hexdigest()
          common = {"schema": 1, "repo": "RangelTech/kernel-harness", "commit": os.environ["GITHUB_SHA"][:7], "version": v,
                    "built_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")}
          svcs = {
            "kernel-harness": {"img": "kernel-harness.image.tar.gz", "tag": "kernel-harness/harness:" + v,
              "healthcheck": {"path": "/health", "expect": 200, "timeout_s": 90, "port": 8080},
              "env": {"required": ["HARNESS_SERVICE_TOKENS", "HARNESS_RUN_TOKEN_SECRET", "HARNESS_BROKER_TOKENS",
                                   "BACKEND_INTERNAL_TOKEN", "HERMES_MASTER_SECRET"]},
              "resources": {"memory": "1g", "cpus": "1"}},
            "rt-hermes": {"img": "rt-hermes.image.tar.gz", "tag": "kernel-harness/rt-hermes:" + v,
              "healthcheck": {"path": "/health", "expect": 200, "timeout_s": 120, "port": 8642},
              "env": {"required": ["RT_BROKER_TOKEN", "OPENAI_API_KEY"]},
              "resources": {"memory": "2g", "cpus": "2"}},
          }
          for name, c in svcs.items():
              m = dict(common, service=name)
              m["artifact"] = {"type": "docker-archive", "asset": c["img"], "sha256": sha(c["img"]),
                               "image_id": image_id(c["img"]), "tag": c["tag"]}
              m["healthcheck"] = c["healthcheck"]; m["env"] = c["env"]; m["resources"] = c["resources"]
              json.dump(m, open(f"release-manifest.{name}.json", "w"), indent=2)
              print(name, m["artifact"]["image_id"])
          PY
      - name: GitHub Release com manifesto e imagem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$V" release-manifest.*.json *.image.tar.gz --title "$V" --notes "Artefato docker-archive (sha256 no manifesto). Deploy: somente vps_rt_infra." --target "${GITHUB_SHA}" || gh release upload "$V" release-manifest.*.json *.image.tar.gz --clobber
