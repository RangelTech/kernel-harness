[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501", "UP038"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "docker: precisa do Docker CLI (executor, restart do Redis)",
]
filterwarnings = ["ignore::DeprecationWarning"]
